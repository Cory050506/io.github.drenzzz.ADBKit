name: Build Flatpak

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  APP_ID: io.github.drenzzz.ADBKit

jobs:
  flatpak:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.flatpak.Builder

      # Same linter Flathub runs on submissions
      - name: Lint manifest
        run: |
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder \
            manifest ${APP_ID}.yml

      - name: Build
        run: |
          flatpak-builder --user --force-clean --sandbox --disable-rofiles-fuse \
            --install-deps-from=flathub --repo=repo builddir ${APP_ID}.yml

      - name: Lint repo (appstream, desktop file, icons, permissions)
        run: |
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder repo repo > lint.json || true
          cat lint.json
          # Mirroring of screenshots/icons only happens on Flathub's buildbot
          jq -e '[.errors[]? | select(. as $e
            | ["appstream-screenshots-not-mirrored-in-ostree",
               "appstream-external-screenshot-url",
               "appstream-remote-icon-not-mirrored"]
            | index($e) | not)] | length == 0' lint.json

      - name: Create bundle
        run: flatpak build-bundle repo adbkit.flatpak ${APP_ID}

      - uses: actions/upload-artifact@v4
        with:
          name: adbkit-flatpak
          path: adbkit.flatpak